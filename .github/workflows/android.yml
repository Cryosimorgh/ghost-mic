name: Android build
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Install Android build packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Load release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
        run: |
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/ghostmic.p12" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ]; then printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostmic.p12"; fi
      - name: Build, unit test and lint
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Package APKs
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/GhostMic-android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/GhostMic-android.apk
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/GhostMic-test-app.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/GhostMic-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/GhostMic-android.apk
          cd artifacts && sha256sum GhostMic-android.apk > GhostMic-android.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GhostMic-android
          path: artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Download APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name GhostMic-android --dir apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apks/GhostMic-test-app.apk
            adb install -r apks/GhostMic-tests.apk
            adb shell am instrument -w -r io.github.cryosimorgh.ghostmic.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-result.txt
            cat instrumentation-result.txt
            grep -q 'OK (' instrumentation-result.txt
            adb shell am start -n io.github.cryosimorgh.ghostmic/.MainActivity
            sleep 2
            adb exec-out screencap -p > GhostMic-android.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-emulator-results
          path: |
            instrumentation-result.txt
            GhostMic-android.png
