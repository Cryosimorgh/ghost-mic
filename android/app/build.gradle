plugins { id 'com.android.application' }
def signingStore = System.getenv('ANDROID_SIGNING_STORE_FILE')
def signingAvailable = signingStore != null && file(signingStore).exists()

android {
    namespace 'io.github.cryosimorgh.ghostmic'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.github.cryosimorgh.ghostmic'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingAvailable) {
            release {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias 'ghostmic'
                keyPassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingAvailable) signingConfig signingConfigs.release
        }
    }
    testOptions { animationsDisabled true }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
